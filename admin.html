<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin | Lory X 1010</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        /* =====================================
           ADMIN GENERAL
        ===================================== */

        .admin-section {
            padding: 60px 0;
            min-height: 70vh;
        }

        .admin-box,
        .dashboard {
            max-width: 1000px;
            margin: auto;
        }

        .admin-box {
            max-width: 500px;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: #fff;
        }

        .admin-box h1 {
            margin-bottom: 25px;
        }


        /* =====================================
           INPUTS
        ===================================== */

        .admin-input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            background: #fff;
            color: #111;
        }

        textarea.admin-input {
            min-height: 120px;
            resize: vertical;
        }


        /* =====================================
           BUTTONS
        ===================================== */

        .admin-button {
            width: 100%;
            padding: 14px;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .admin-button:hover {
            opacity: .9;
        }

        .logout-button {
            padding: 10px 18px;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }


        /* =====================================
           MESSAGES
        ===================================== */

        .message {
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.5;
        }


        /* =====================================
           DASHBOARD
        ===================================== */

        .dashboard {
            display: none;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            gap: 15px;
        }


        /* =====================================
           PRODUCT FORM
        ===================================== */

        .product-form {
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 12px;
            margin-bottom: 50px;
            background: #fff;
        }

        .product-form h2 {
            margin-bottom: 20px;
        }


        /* =====================================
           IMAGE UPLOAD
        ===================================== */

        .file-label {
            display: block;
            padding: 15px;
            border: 1px dashed #999;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 15px;
            background: #fafafa;
        }

        #productImage {
            display: none;
        }

        .image-preview {
            width: 180px;
            height: 180px;
            margin: 10px 0 20px;
            border-radius: 10px;
            overflow: hidden;
            background: #f5f5f5;
            display: none;
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }


        /* =====================================
           MANAGE PRODUCTS
        ===================================== */

        .manage-section {
            margin-top: 40px;
        }

        .manage-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .refresh-button {
            padding: 10px 16px;
            border: 1px solid #111;
            background: #fff;
            color: #111;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }


        /* =====================================
           PRODUCT LIST
        ===================================== */

        .admin-product-list {
            display: grid;
            gap: 15px;
        }

        .admin-product {
            display: grid;
            grid-template-columns: 100px 1fr auto;
            gap: 20px;
            align-items: center;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fff;
        }

        .admin-product-image {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
            background: #f5f5f5;
        }

        .admin-product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .admin-product-info h3 {
            margin-bottom: 6px;
            font-size: 18px;
        }

        .admin-product-info p {
            margin: 4px 0;
            color: #666;
            font-size: 14px;
        }

        .product-status {
            display: inline-block;
            margin-top: 8px;
            padding: 5px 9px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 700;
        }

        .status-published {
            background: #e8f7e8;
            color: #187a18;
        }

        .status-hidden {
            background: #f5eaea;
            color: #a00000;
        }


        /* =====================================
           PRODUCT ACTIONS
        ===================================== */

        .product-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 130px;
        }

        .action-button {
            padding: 9px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            border: 1px solid #111;
            background: #fff;
            color: #111;
        }

        .publish-button {
            background: #111;
            color: #fff;
        }

        .delete-button {
            border-color: #b00000;
            color: #b00000;
            background: #fff;
        }


        /* =====================================
           EMPTY PRODUCTS
        ===================================== */

        .empty-products {
            text-align: center;
            padding: 50px 20px;
            border: 1px dashed #ccc;
            border-radius: 10px;
            color: #666;
        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 700px) {

            .admin-section {
                padding: 40px 0;
            }

            .dashboard-header {
                align-items: flex-start;
            }

            .admin-product {
                grid-template-columns: 80px 1fr;
            }

            .admin-product-image {
                width: 80px;
                height: 80px;
            }

            .product-actions {
                grid-column: 1 / -1;
                flex-direction: row;
            }

            .action-button {
                flex: 1;
            }

            .manage-header {
                align-items: flex-start;
            }

        }

    </style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="header">

    <div class="container navbar">

        <a
            href="index.html"
            class="logo"
        >
            Lory X <span>1010</span>
        </a>


        <nav class="nav">

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

        </nav>

    </div>

</header>



<!-- =========================================
     MAIN
========================================= -->

<main>

<section class="admin-section">

<div class="container">


<!-- =========================================
     LOGIN
========================================= -->

<div
    id="loginBox"
    class="admin-box"
>

    <h1>
        Admin Login
    </h1>


    <input
        type="email"
        id="email"
        class="admin-input"
        placeholder="Admin Email"
    >


    <input
        type="password"
        id="password"
        class="admin-input"
        placeholder="Password"
    >


    <button
        id="loginBtn"
        class="admin-button"
    >
        Login
    </button>


    <p
        id="loginMessage"
        class="message"
    ></p>

</div>



<!-- =========================================
     DASHBOARD
========================================= -->

<div
    id="dashboard"
    class="dashboard"
>


<!-- DASHBOARD HEADER -->

<div class="dashboard-header">

    <div>

        <h1>
            Admin Dashboard
        </h1>

        <p>
            Lory X 1010
        </p>

    </div>


    <button
        id="logoutBtn"
        class="logout-button"
    >
        Logout
    </button>

</div>



<!-- =========================================
     ADD PRODUCT
========================================= -->

<div class="product-form">

    <h2>
        Add Product
    </h2>


    <input
        type="text"
        id="productName"
        class="admin-input"
        placeholder="Product Name"
    >


    <input
        type="number"
        id="productPrice"
        class="admin-input"
        placeholder="Price"
    >


    <input
        type="text"
        id="productCategory"
        class="admin-input"
        placeholder="Category e.g. Fashion"
    >



    <!-- IMAGE -->

    <label
        for="productImage"
        class="file-label"
    >
        📷 Choose Product Image
    </label>


    <input
        type="file"
        id="productImage"
        accept="image/*"
    >


    <div
        id="imagePreview"
        class="image-preview"
    >

        <img
            id="previewImg"
            src=""
            alt="Product Preview"
        >

    </div>



    <input
        type="text"
        id="productSizes"
        class="admin-input"
        placeholder="Sizes e.g. M, L, XL, XXL"
    >


    <input
        type="text"
        id="productColors"
        class="admin-input"
        placeholder="Colors e.g. Black, White"
    >


    <input
        type="number"
        id="productStock"
        class="admin-input"
        placeholder="Stock"
        value="0"
        min="0"
    >


    <textarea
        id="productDescription"
        class="admin-input"
        placeholder="Product Description"
    ></textarea>


    <button
        id="addProductBtn"
        class="admin-button"
    >
        Add Product
    </button>


    <p
        id="productMessage"
        class="message"
    ></p>

</div>



<!-- =========================================
     MANAGE PRODUCTS
========================================= -->

<div class="manage-section">


    <div class="manage-header">

        <div>

            <h2>
                Manage Products
            </h2>

            <p>
                View, publish, hide or delete products.
            </p>

        </div>


        <button
            id="refreshProductsBtn"
            class="refresh-button"
        >
            🔄 Refresh
        </button>

    </div>



    <div
        id="adminProductList"
        class="admin-product-list"
    >

        <div class="empty-products">
            Loading products...
        </div>

    </div>

</div>


</div>

</div>

</section>

</main>



<!-- =========================================
     FOOTER
========================================= -->

<footer class="footer">

    <div class="container">

        <div class="copyright">
            © 2026 Lory X 1010. All rights reserved.
        </div>

    </div>

</footer>



<!-- =========================================
     SUPABASE
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<script>

/* =========================================
   SUPABASE CONFIGURATION
========================================= */

const SUPABASE_URL =
    "https://hmvzqwatmsctlvzylmys.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_BJXkMjk7jvgYKXgiYMbvUw_6S17oAAY";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =========================================
   ELEMENTS
========================================= */

const loginBox =
    document.getElementById("loginBox");


const dashboard =
    document.getElementById("dashboard");


const loginBtn =
    document.getElementById("loginBtn");


const logoutBtn =
    document.getElementById("logoutBtn");


const loginMessage =
    document.getElementById("loginMessage");


const productMessage =
    document.getElementById("productMessage");


const productImage =
    document.getElementById("productImage");


const imagePreview =
    document.getElementById("imagePreview");


const previewImg =
    document.getElementById("previewImg");


const adminProductList =
    document.getElementById("adminProductList");


const refreshProductsBtn =
    document.getElementById(
        "refreshProductsBtn"
    );



/* =========================================
   IMAGE PREVIEW
========================================= */

productImage.addEventListener(
    "change",
    function () {

        const file =
            this.files[0];


        if (!file) {

            imagePreview.style.display =
                "none";

            return;
        }


        previewImg.src =
            URL.createObjectURL(file);


        imagePreview.style.display =
            "block";

    }
);



/* =========================================
   CHECK USER
========================================= */

async function checkUser() {

    const {
        data: { user }
    } =
        await supabaseClient.auth.getUser();


    if (user) {

        loginBox.style.display =
            "none";

        dashboard.style.display =
            "block";


        loadAdminProducts();

    } else {

        loginBox.style.display =
            "block";

        dashboard.style.display =
            "none";

    }

}



/* =========================================
   LOGIN
========================================= */

loginBtn.addEventListener(
    "click",
    async () => {

        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        if (!email || !password) {

            loginMessage.textContent =
                "Please enter email and password.";

            return;
        }


        loginMessage.textContent =
            "Logging in...";


        const {
            error
        } =
            await supabaseClient.auth
                .signInWithPassword({

                    email: email,

                    password: password

                });


        if (error) {

            loginMessage.textContent =
                error.message;

            return;
        }


        loginMessage.textContent =
            "Login successful!";


        checkUser();

    }
);



/* =========================================
   LOGOUT
========================================= */

logoutBtn.addEventListener(
    "click",
    async () => {

        await supabaseClient.auth.signOut();

        checkUser();

    }
);



/* =========================================
   ADD PRODUCT
========================================= */

document
    .getElementById("addProductBtn")
    .addEventListener(
        "click",
        async () => {


        const name =
            document
                .getElementById("productName")
                .value
                .trim();


        const price =
            Number(
                document
                    .getElementById("productPrice")
                    .value
            );


        const category =
            document
                .getElementById("productCategory")
                .value
                .trim();


        const sizes =
            document
                .getElementById("productSizes")
                .value
                .trim();


        const colors =
            document
                .getElementById("productColors")
                .value
                .trim();


        const stock =
            Number(
                document
                    .getElementById("productStock")
                    .value
            );


        const description =
            document
                .getElementById("productDescription")
                .value
                .trim();


        const file =
            productImage.files[0];


        /* VALIDATION */

        if (!name || !price) {

            productMessage.textContent =
                "Product name and price are required.";

            return;
        }


        if (!file) {

            productMessage.textContent =
                "Please choose a product image.";

            return;
        }


        if (!file.type.startsWith("image/")) {

            productMessage.textContent =
                "Please select an image file.";

            return;
        }


        if (
            file.size >
            5 * 1024 * 1024
        ) {

            productMessage.textContent =
                "Image must be less than 5 MB.";

            return;
        }


        productMessage.textContent =
            "Uploading image...";


        /* FILE NAME */

        const fileExtension =
            file.name
                .split(".")
                .pop();


        const fileName =
            `${Date.now()}-${crypto.randomUUID()}.${fileExtension}`;


        /* UPLOAD IMAGE */

        const {
            error: uploadError
        } =
            await supabaseClient
                .storage
                .from("product-images")
                .upload(
                    fileName,
                    file
                );


        if (uploadError) {

            productMessage.textContent =
                "Image upload failed: " +
                uploadError.message;

            return;
        }


        /* PUBLIC URL */

        const {
            data: publicUrlData
        } =
            supabaseClient
                .storage
                .from("product-images")
                .getPublicUrl(
                    fileName
                );


        const image_url =
            publicUrlData.publicUrl;


        /* SAVE PRODUCT */

        productMessage.textContent =
            "Saving product...";


        const {
            error: productError
        } =
            await supabaseClient
                .from("products")
                .insert([{

                    name: name,

                    price: price,

                    description: description,

                    image_url: image_url,

                    category: category,

                    sizes: sizes,

                    colors: colors,

                    stock: stock,

                    is_published: true

                }])
