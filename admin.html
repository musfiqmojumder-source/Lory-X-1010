<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Lory X 1010</title>

    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

<!-- =========================================
     HEADER
========================================= -->

<header class="header admin-header">

    <div class="container admin-navbar">

        <a href="index.html" class="logo">
            Lory X <span>1010</span>
        </a>

        <a href="index.html" class="back-home">
            ← Store
        </a>

    </div>

</header>


<main>

<section class="admin-page">

<div class="container">


<!-- =========================================
     LOGIN
========================================= -->

<div id="loginSection" class="login-card">

    <div class="login-icon">
        LX
    </div>

    <p class="admin-label">
        LORY X 1010
    </p>

    <h1>
        Admin Login
    </h1>

    <p class="login-subtitle">
        Sign in to manage your products.
    </p>


    <form id="loginForm">

        <div class="field">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                autocomplete="email"
                required
            >

        </div>


        <div class="field">

            <label for="password">
                Password
            </label>

            <div class="password-wrap">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    id="togglePassword"
                    class="password-toggle"
                    aria-label="Show password"
                >
                    Show
                </button>

            </div>

        </div>


        <button
            type="submit"
            id="loginButton"
            class="admin-primary-button"
        >
            Login
        </button>


        <div
            id="loginMessage"
            class="admin-message"
        ></div>

    </form>

</div>


<!-- =========================================
     DASHBOARD
========================================= -->

<div
    id="dashboardSection"
    class="dashboard"
    hidden
>


    <!-- Dashboard Top -->

    <div class="dashboard-top">

        <div>

            <p class="admin-label">
                ADMIN PANEL
            </p>

            <h1>
                Dashboard
            </h1>

            <p id="adminEmailText">
                Welcome back.
            </p>

        </div>


        <button
            type="button"
            id="logoutButton"
            class="logout-button"
        >
            Logout
        </button>

    </div>


    <!-- =====================================
         STATS
    ====================================== -->

    <div class="stats-grid">

        <div class="stat-card">

            <span>
                Total Products
            </span>

            <strong id="totalProducts">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                Published
            </span>

            <strong id="publishedProducts">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                Hidden
            </span>

            <strong id="hiddenProducts">
                0
            </strong>

        </div>

    </div>


    <!-- =====================================
         PRODUCT FORM
    ====================================== -->

    <div class="admin-panel">

        <div class="panel-heading">

            <div>

                <p class="admin-label">
                    PRODUCT
                </p>

                <h2 id="formTitle">
                    Add New Product
                </h2>

            </div>

        </div>


        <form id="productForm">


            <!-- Product Name -->

            <div class="field">

                <label for="productName">
                    Product Name *
                </label>

                <input
                    type="text"
                    id="productName"
                    placeholder="e.g. Premium Cotton T-Shirt"
                    required
                >

            </div>


            <!-- Price + Stock -->

            <div class="two-column">

                <div class="field">

                    <label for="productPrice">
                        Price (৳) *
                    </label>

                    <input
                        type="number"
                        id="productPrice"
                        placeholder="850"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <div class="field">

                    <label for="productStock">
                        Stock
                    </label>

                    <input
                        type="number"
                        id="productStock"
                        placeholder="10"
                        value="0"
                        min="0"
                        step="1"
                    >

                </div>

            </div>


            <!-- Category -->

            <div class="field">

                <label for="productCategory">
                    Category *
                </label>

                <select
                    id="productCategory"
                    required
                >

                    <option value="">
                        Select Category
                    </option>

                    <option value="Fashion">
                        Fashion
                    </option>

                    <option value="Gadget">
                        Gadget
                    </option>

                    <option value="Home">
                        Home
                    </option>

                    <option value="Others">
                        Others
                    </option>

                </select>

            </div>


            <!-- Image -->

            <div class="field">

                <label>
                    Product Image
                </label>

                <label
                    for="productImage"
                    class="upload-box"
                >

                    <span class="upload-icon">
                        +
                    </span>

                    <strong>
                        Choose Product Image
                    </strong>

                    <small>
                        JPG, PNG or WEBP · Maximum 5 MB
                    </small>

                </label>

                <input
                    type="file"
                    id="productImage"
                    accept="image/jpeg,image/png,image/webp"
                    hidden
                >

            </div>


            <!-- Image Preview -->

            <div
                id="imagePreviewBox"
                class="image-preview-box"
                hidden
            >

                <img
                    id="imagePreview"
                    src=""
                    alt="Product preview"
                >

                <button
                    type="button"
                    id="removeImageButton"
                    class="remove-image"
                >
                    Remove Image
                </button>

            </div>


            <!-- Sizes -->

            <div class="field">

                <label for="productSizes">
                    Sizes
                </label>

                <input
                    type="text"
                    id="productSizes"
                    placeholder="M, L, XL, XXL"
                >

            </div>


            <!-- Colors -->

            <div class="field">

                <label for="productColors">
                    Colors
                </label>

                <input
                    type="text"
                    id="productColors"
                    placeholder="Black, White, Navy"
                >

            </div>


            <!-- Description -->

            <div class="field">

                <label for="productDescription">
                    Description
                </label>

                <textarea
                    id="productDescription"
                    placeholder="Write product description..."
                ></textarea>

            </div>


            <!-- Publish -->

            <label class="publish-toggle">

                <input
                    type="checkbox"
                    id="productPublished"
                    checked
                >

                <span class="toggle-ui"></span>

                <span>

                    <strong>
                        Publish Product
                    </strong>

                    <small>
                        Published products will appear on the store.
                    </small>

                </span>

            </label>


            <!-- Buttons -->

            <div class="form-actions">

                <button
                    type="submit"
                    id="saveProductButton"
                    class="admin-primary-button"
                >
                    Add Product
                </button>


                <button
                    type="button"
                    id="cancelEditButton"
                    class="cancel-button"
                    hidden
                >
                    Cancel Edit
                </button>

            </div>


            <div
                id="productMessage"
                class="admin-message"
            ></div>

        </form>

    </div>


    <!-- =====================================
         MANAGE PRODUCTS
    ====================================== -->

    <div class="admin-panel manage-panel">

        <div class="manage-heading">

            <div>

                <p class="admin-label">
                    INVENTORY
                </p>

                <h2>
                    Manage Products
                </h2>

            </div>


            <button
                type="button"
                id="refreshButton"
                class="refresh-button"
            >
                ↻ Refresh
            </button>

        </div>


        <div
            id="productList"
            class="admin-product-list"
        >

            <div class="empty-products">
                Loading products...
            </div>

        </div>

    </div>


</div>

</div>

</section>

</main>


<!-- =========================================
     FOOTER
========================================= -->

<footer class="footer">

    <div class="container">

        <div class="copyright">
            © 2026 Lory X 1010. All rights reserved.
        </div>

    </div>

</footer>


<!-- =========================================
     SUPABASE
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/admin.js"></script>

</body>
</html>
