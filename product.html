<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product | Lory X 1010</title>

    <meta name="description"
          content="View product details at Lory X 1010.">

    <link rel="stylesheet" href="css/style.css">

    <style>
        .product-details {
            padding: 70px 0;
        }

        .product-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: start;
        }

        .detail-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #f5f5f5;
            border-radius: 12px;
            overflow: hidden;
        }

        .detail-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .detail-category {
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #777;
            margin-bottom: 10px;
        }

        .detail-title {
            font-size: clamp(32px, 5vw, 55px);
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .detail-price {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 25px;
        }

        .detail-description {
            color: #555;
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .buy-button {
            display: inline-block;
            background: #111;
            color: #fff;
            padding: 15px 30px;
            border-radius: 6px;
            font-weight: 700;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: #555;
        }

        @media (max-width: 700px) {
            .product-detail-grid {
                grid-template-columns: 1fr;
                gap: 35px;
            }

            .product-details {
                padding: 45px 0;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <div class="container navbar">

        <a href="index.html" class="logo">
            Lory X <span>1010</span>
        </a>

        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

        <a href="products.html" class="shop-btn">
            Shop Now
        </a>

    </div>

</header>


<main>

    <section class="product-details">

        <div class="container">

            <a href="products.html" class="back-link">
                ← Back to Products
            </a>

            <div id="product-detail"
                 class="product-detail-grid">

                <!-- Product will be loaded by JavaScript -->

            </div>

        </div>

    </section>

</main>


<footer class="footer">

    <div class="container footer-content">

        <div>
            <h2>Lory X 1010</h2>

            <p>
                Quality products for better shopping.
            </p>
        </div>

        <div>

            <h3>Quick Links</h3>

            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>

        </div>

    </div>

    <div class="copyright">
        © 2026 Lory X 1010. All rights reserved.
    </div>

</footer>


<script src="js/script.js"></script>

</body>
</html>
